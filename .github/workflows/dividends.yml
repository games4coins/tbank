name: Dividend data
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Update mode'
        type: choice
        options:
          - all
          - portfolio
          - dividends
        default: all
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
concurrency:
  group: dividend-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official Russian CA bundle (verified HTTPS and SHA256)
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --retry 2 https://gu-st.ru/content/Other/doc/russiantrustedca.pem -o "$RUNNER_TEMP/tbank-ca.pem"
          echo "6d1b66e7c1aa2512ad3abb50d6a6f144c9ee9d80fd7fbe1c9255a39f8e790944  $RUNNER_TEMP/tbank-ca.pem" | sha256sum --check
          echo "TBANK_CA_FILE=$RUNNER_TEMP/tbank-ca.pem" >> "$GITHUB_ENV"
      - name: Collect dividend events
        if: inputs.mode != 'portfolio'
        env:
          TBANK_TOKEN: ${{ secrets.TBANK_TOKEN }}
        run: python collect.py
      - name: Stage fresh market data
        run: |
          if [ "${{ inputs.mode }}" != "portfolio" ]; then cp data.json "$RUNNER_TEMP/radar-data.json"; fi
          rm -f portfolio.enc.json
      - name: Install portfolio encryption library
        if: inputs.mode != 'dividends'
        run: python -m pip install cryptography==46.0.3
      - name: Encrypt personal portfolio
        if: inputs.mode != 'dividends'
        id: portfolio
        continue-on-error: true
        env:
          TBANK_TOKEN: ${{ secrets.TBANK_TOKEN }}
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
        run: python collect_portfolio.py
      - name: Save public market data and encrypted portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.portfolio.outcome }}" = "success" ] && test -f portfolio.enc.json; then
            cp portfolio.enc.json "$RUNNER_TEMP/radar-portfolio.enc.json"
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if test -f "$RUNNER_TEMP/radar-data.json"; then
              cp "$RUNNER_TEMP/radar-data.json" data.json
              git add -- data.json
            fi
            if test -f "$RUNNER_TEMP/radar-portfolio.enc.json"; then
              cp "$RUNNER_TEMP/radar-portfolio.enc.json" portfolio.enc.json
              git add -- portfolio.enc.json
            fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh dividend data and encrypted portfolio"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "::error::Unable to publish data after five attempts"
          exit 1
